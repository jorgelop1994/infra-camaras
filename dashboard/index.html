<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pi Cámaras</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    padding: 1px;
  }
  .cell {
    position: relative;
    background: #0d1117;
    overflow: hidden;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .label {
    position: absolute;
    top: 4px;
    left: 4px;
    z-index: 10;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 1px 6px;
    border-radius: 3px;
    font: 10px -apple-system, sans-serif;
    pointer-events: none;
  }
  .empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #21262d;
    font: 48px -apple-system, sans-serif;
  }
</style>
</head>
<body>
<div class="cell">
  <div class="label">Xiaomi</div>
  <iframe src="http://10.88.88.1:1984/stream.html?src=xiaomi"></iframe>
</div>
<div class="cell">
  <div class="label">A9</div>
  <iframe src="http://10.88.88.1:1984/stream.html?src=a9&mode=mjpeg"></iframe>
</div>
<div class="cell">
  <div class="label">Sterem</div>
  <iframe src="http://10.88.88.1:1984/stream.html?src=steren"></iframe>
</div>
<div class="cell">
  <div class="label">—</div>
  <div class="empty">+</div>
</div>
</body>
</html>
