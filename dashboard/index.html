<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pi Cámaras</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    padding: 1px;
    transition: grid-template-columns 0.3s, grid-template-rows 0.3s;
  }
  body.single {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
  }
  body.single .cell:not(.expanded) {
    display: none;
  }
  .cell {
    position: relative;
    background: #0d1117;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
  }
  iframe {
    flex: 1;
    width: 100%;
    border: 0;
    display: block;
    background: #0d1117;
    pointer-events: auto;
  }

  /* ── Top bar ── */
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .topbar-label {
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    padding: 4px 0;
    -webkit-tap-highlight-color: transparent;
  }
  .topbar-label:active {
    opacity: 0.6;
  }
  .topbar-status {
    font-size: 10px;
    color: #8b949e;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .topbar-status.connected { color: #3fb950; }
  .topbar-status.reloading { color: #d29922; }
  .topbar-status.error { color: #f85149; }

  /* ── Back button (full-screen) ── */
  .back-btn {
    display: none;
    position: absolute;
    top: 5px;
    left: 5px;
    z-index: 30;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }
  .cell.expanded .back-btn { display: flex; }

  /* ── Menu trigger ── */
  .menu-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: rgba(255,255,255,0.7);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .menu-btn:hover, .menu-btn:active { background: rgba(48,54,61,0.9); color: #f0f6fc; }
  .menu-btn.open { background: rgba(48,54,61,0.9); color: #f0f6fc; }

  /* ── Menu panel ── */
  .menu-panel {
    position: absolute;
    right: 44px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    display: none;
    flex-direction: column;
    gap: 4px;
    padding: 6px;
    background: rgba(13,17,23,0.94);
    border: 1px solid rgba(48,54,61,0.6);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    pointer-events: auto;
  }
  .menu-panel.open { display: flex; }

  .menu-item {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #8b949e;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .menu-item:hover, .menu-item:active { background: rgba(48,54,61,0.7); color: #f0f6fc; }
  .menu-item.audio-off { color: #d29922; }
  .menu-item.audio-on { color: #3fb950; }
  .menu-item.fullscreen { color: #58a6ff; }

  /* ── Loading overlay ── */
  .loading-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 15;
    background: #0d1117;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #484f58;
  }
  .loading-overlay.active { display: flex; }
  .empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #21262d;
    font-size: 48px;
    font-weight: 100;
    flex: 1;
  }
</style>
</head>
<body>

<div class="cell" data-cam="xiaomi">
  <div class="loading-overlay">conectando…</div>
  <iframe src="http://10.88.88.1:1984/stream.html?src=xiaomi"></iframe>
  <div class="topbar">
    <span class="topbar-label">Xiaomi</span>
    <span class="topbar-status connected">en vivo</span>
  </div>
  <button class="back-btn" title="Minimizar">✕</button>
  <button class="menu-btn" title="Más opciones">⋮</button>
  <div class="menu-panel">
    <button class="menu-item fullscreen" data-action="fullscreen" title="Pantalla completa">⛶</button>
    <button class="menu-item" data-action="reload" title="Recargar">↻</button>
    <a class="menu-item" data-action="snapshot" href="/capture/xiaomi" target="_blank" download="xiaomi.jpg" title="Snapshot">📷</a>
  </div>
</div>

<div class="cell" data-cam="a9">
  <div class="loading-overlay">conectando…</div>
  <iframe src="http://10.88.88.1:1984/stream.html?src=a9&mode=mjpeg"></iframe>
  <div class="topbar">
    <span class="topbar-label">A9</span>
    <span class="topbar-status connected">en vivo</span>
  </div>
  <button class="back-btn" title="Minimizar">✕</button>
  <button class="menu-btn" title="Más opciones">⋮</button>
  <div class="menu-panel">
    <button class="menu-item fullscreen" data-action="fullscreen" title="Pantalla completa">⛶</button>
    <button class="menu-item" data-action="reload" title="Recargar">↻</button>
    <a class="menu-item" data-action="snapshot" href="/capture/a9" target="_blank" download="a9.jpg" title="Snapshot">📷</a>
  </div>
</div>

<div class="cell" data-cam="steren">
  <div class="loading-overlay">conectando…</div>
  <iframe src="http://10.88.88.1:1984/stream.html?src=steren" allow="autoplay; microphone"></iframe>
  <div class="topbar">
    <span class="topbar-label">Sterem</span>
    <span class="topbar-status connected">en vivo</span>
  </div>
  <button class="back-btn" title="Minimizar">✕</button>
  <button class="menu-btn" title="Más opciones">⋮</button>
  <div class="menu-panel">
    <button class="menu-item fullscreen" data-action="fullscreen" title="Pantalla completa">⛶</button>
    <button class="menu-item" data-action="reload" title="Recargar">↻</button>
    <button class="menu-item audio-off" data-action="audio" title="Activar audio" style="display:none">🔇</button>
    <a class="menu-item" data-action="snapshot" href="/capture/steren" target="_blank" download="steren.jpg" title="Snapshot">📷</a>
  </div>
</div>

<div class="cell">
  <div class="topbar">
    <span class="topbar-label">—</span>
    <span class="topbar-status"></span>
  </div>
  <div class="empty">+</div>
</div>

<script>
(function() {
  'use strict';

  const LOAD_TIMEOUT = 15000;
  const MENU_HIDE_DELAY = 10000;
  let activeMenu = null;
  let hideTimer = null;
  let expandedCell = null;

  // ── Toggle full-screen ──
  function toggleFullscreen(cell) {
    const isExpanded = cell.classList.contains('expanded');

    if (isExpanded) {
      // Minimizar
      cell.classList.remove('expanded');
      document.body.classList.remove('single');
      expandedCell = null;
    } else {
      // Expandir: cerrar menú si estaba abierto
      if (activeMenu) closeMenu(activeMenu);
      // Sacar expanded de cualquier otra
      document.querySelectorAll('.cell.expanded').forEach(c => c.classList.remove('expanded'));
      // Expandir esta
      cell.classList.add('expanded');
      document.body.classList.add('single');
      expandedCell = cell;
    }
  }

  // ── Cerrar menú ──
  function closeMenu(panel) {
    panel.classList.remove('open');
    const btn = panel.closest('.cell').querySelector('.menu-btn');
    if (btn) { btn.classList.remove('open'); btn.textContent = '⋮'; }
    if (activeMenu === panel) activeMenu = null;
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  }

  // ── Abrir menú ──
  function openMenu(panel, btn) {
    panel.classList.add('open');
    btn.classList.add('open');
    btn.textContent = '✕';
    activeMenu = panel;
    resetHideTimer(panel);
  }

  function resetHideTimer(panel) {
    if (hideTimer) { clearTimeout(hideTimer); }
    hideTimer = setTimeout(() => closeMenu(panel), MENU_HIDE_DELAY);
  }

  document.querySelectorAll('.cell[data-cam]').forEach(cell => {
    const cam = cell.dataset.cam;
    const iframe = cell.querySelector('iframe');
    const overlay = cell.querySelector('.loading-overlay');
    const status = cell.querySelector('.topbar-status');
    const menuBtn = cell.querySelector('.menu-btn');
    const menuPanel = cell.querySelector('.menu-panel');
    const backBtn = cell.querySelector('.back-btn');
    const topLabel = cell.querySelector('.topbar-label');

    // ── Estado inicial ──
    status.className = 'topbar-status connected';
    status.textContent = 'en vivo';

    // ── Iframe load detection ──
    iframe.addEventListener('load', () => {
      overlay.classList.remove('active');
      status.className = 'topbar-status connected';
      status.textContent = 'en vivo';
    });

    let loadTimer = setTimeout(() => {
      if (overlay.classList.contains('active')) {
        overlay.classList.remove('active');
        status.className = 'topbar-status error';
        status.textContent = 'sin señal';
      }
    }, LOAD_TIMEOUT);

    iframe.addEventListener('load', () => {
      clearTimeout(loadTimer);
      loadTimer = setTimeout(() => {
        if (overlay.classList.contains('active')) {
          overlay.classList.remove('active');
          status.className = 'topbar-status error';
          status.textContent = 'sin señal';
        }
      }, LOAD_TIMEOUT);
    });

    // ── Tap nombre → full-screen ──
    topLabel.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreen(cell);
    });

    // ── Back button ──
    backBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreen(cell);
    });

    // ── Menu toggle ──
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menuPanel.classList.contains('open');
      if (activeMenu && activeMenu !== menuPanel) closeMenu(activeMenu);
      if (isOpen) closeMenu(menuPanel);
      else openMenu(menuPanel, menuBtn);
    });

    // ── Acciones del menú ──
    menuPanel.querySelectorAll('[data-action]').forEach(item => {
      item.addEventListener('click', (e) => {
        const action = item.dataset.action;

        if (action === 'fullscreen') {
          e.preventDefault();
          toggleFullscreen(cell);
          closeMenu(menuPanel);
        }

        if (action === 'reload') {
          e.preventDefault();
          const now = Date.now();
          if (menuPanel._cooldown && now - menuPanel._cooldown < 3000) return;
          menuPanel._cooldown = now;
          status.className = 'topbar-status reloading';
          status.textContent = 'recargando…';
          overlay.classList.add('active');
          iframe.src = iframe.src;
          closeMenu(menuPanel);
        }

        if (action === 'audio') {
          e.preventDefault();
          item.classList.remove('audio-off');
          item.classList.add('audio-on');
          item.textContent = '🔊';
          iframe.src = iframe.src;
          setTimeout(() => { item.style.display = 'none'; }, 2000);
          closeMenu(menuPanel);
        }

        if (action === 'snapshot') {
          closeMenu(menuPanel);
        }

        resetHideTimer(menuPanel);
      });
    });

    // ── Auto-hide menu ──
    menuPanel.addEventListener('mouseenter', () => resetHideTimer(menuPanel));
    menuPanel.addEventListener('mouseleave', () => resetHideTimer(menuPanel));

    // ── Cerrar menú al tocar fuera ──
    document.addEventListener('click', (e) => {
      if (activeMenu && !activeMenu.contains(e.target) && !menuBtn.contains(e.target)) {
        closeMenu(activeMenu);
      }
    });

    // ── Mostrar botón audio Sterem ──
    const audioItem = menuPanel.querySelector('[data-action="audio"]');
    if (audioItem) {
      setTimeout(() => { audioItem.style.display = 'flex'; }, 3000);
    }

    // ── Visibilidad ──
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        setTimeout(() => {
          status.className = 'topbar-status connected';
          status.textContent = 'en vivo';
        }, 500);
      }
    });
  });

  // ── Cerrar full-screen con Escape ──
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && expandedCell) {
      toggleFullscreen(expandedCell);
    }
  });
})();
</script>
</body>
</html>
