<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pi Cámaras</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    padding: 1px;
    transition: grid-template-columns 0.3s, grid-template-rows 0.3s;
  }
  body.single {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
  }
  body.single .cell:not(.expanded) { display: none; }
  .cell {
    position: relative;
    background: #0d1117;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  iframe {
    flex: 1;
    width: 100%;
    border: 0;
    display: block;
    background: #0d1117;
  }

  .cam-badge {
    position: absolute;
    top: 4px;
    left: 4px;
    z-index: 20;
    color: rgba(255,255,255,0.85);
    font-size: 10px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.5);
    letter-spacing: 0.3px;
    padding: 2px 4px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }
  .cam-badge:active { opacity: 0.5; }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .status-dot.ok { background: #3fb950; box-shadow: 0 0 4px #3fb950; }
  .status-dot.err { background: #f85149; box-shadow: 0 0 4px #f85149; }
  .status-dot.loading { background: #d29922; box-shadow: 0 0 4px #d29922; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .back-btn {
    display: none;
    position: absolute;
    top: 4px;
    right: 4px;
    z-index: 30;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .cell.expanded .back-btn { display: flex; }
  .back-btn:active { background: rgba(48,54,61,0.8); }

  .menu-btn {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.45);
    color: rgba(255,255,255,0.65);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .menu-btn:active { background: rgba(48,54,61,0.8); color: #f0f6fc; }
  .menu-btn.open { background: rgba(48,54,61,0.8); color: #f0f6fc; }

  .menu-panel {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    display: none;
    flex-direction: column;
    gap: 4px;
    padding: 5px;
    background: rgba(13,17,23,0.94);
    border: 1px solid rgba(48,54,61,0.5);
    border-radius: 10px;
    backdrop-filter: blur(10px);
  }
  .menu-panel.open { display: flex; }

  .menu-item {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #8b949e;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .menu-item:active { background: rgba(48,54,61,0.7); color: #f0f6fc; }
  .menu-item.audio-off { color: #d29922; }
  .menu-item.audio-on { color: #3fb950; }
  .menu-item.expand { color: #58a6ff; }
  .menu-item.full { color: #3fb950; }

  .loading-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    background: rgba(13,17,23,0.85);
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #484f58;
  }
  .loading-overlay.active { display: flex; }

  .empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #21262d;
    font-size: 48px;
    font-weight: 100;
    flex: 1;
  }
</style>
</head>
<body>

<div class="cell" data-cam="xiaomi">
  <div class="loading-overlay">conectando…</div>
  <iframe src="http://10.88.88.1:1984/stream.html?src=xiaomi" allowfullscreen allow="autoplay; microphone; picture-in-picture"></iframe>
  <span class="cam-badge"><span class="status-dot ok"></span>Xiaomi</span>
  <button class="back-btn">✕</button>
  <button class="menu-btn" title="Más">⋮</button>
  <div class="menu-panel">
    <button class="menu-item expand" data-action="expand" title="Expandir al grid">⛶</button>
    <button class="menu-item full" data-action="fullscreen" title="Pantalla completa (navegador)">🖵</button>
    <button class="menu-item" data-action="reload" title="Recargar">↻</button>
    <a class="menu-item" data-action="snapshot" href="/capture/xiaomi" target="_blank" download="xiaomi.jpg" title="Snapshot">📷</a>
  </div>
</div>

<div class="cell" data-cam="a9">
  <div class="loading-overlay">conectando…</div>
  <iframe src="http://10.88.88.1:1984/stream.html?src=a9&mode=mjpeg" allowfullscreen allow="autoplay; microphone; picture-in-picture"></iframe>
  <span class="cam-badge"><span class="status-dot ok"></span>A9</span>
  <button class="back-btn">✕</button>
  <button class="menu-btn" title="Más">⋮</button>
  <div class="menu-panel">
    <button class="menu-item expand" data-action="expand" title="Expandir al grid">⛶</button>
    <button class="menu-item full" data-action="fullscreen" title="Pantalla completa (navegador)">🖵</button>
    <button class="menu-item" data-action="reload" title="Recargar">↻</button>
    <a class="menu-item" data-action="snapshot" href="/capture/a9" target="_blank" download="a9.jpg" title="Snapshot">📷</a>
  </div>
</div>

<div class="cell" data-cam="steren">
  <div class="loading-overlay">conectando…</div>
  <iframe src="http://10.88.88.1:1984/stream.html?src=steren" allowfullscreen allow="autoplay; microphone; picture-in-picture"></iframe>
  <span class="cam-badge"><span class="status-dot ok"></span>Sterem</span>
  <button class="back-btn">✕</button>
  <button class="menu-btn" title="Más">⋮</button>
  <div class="menu-panel">
    <button class="menu-item expand" data-action="expand" title="Expandir al grid">⛶</button>
    <button class="menu-item full" data-action="fullscreen" title="Pantalla completa (navegador)">🖵</button>
    <button class="menu-item" data-action="reload" title="Recargar">↻</button>
    <button class="menu-item audio-off" data-action="audio" title="Activar audio" style="display:none">🔇</button>
    <a class="menu-item" data-action="snapshot" href="/capture/steren" target="_blank" download="steren.jpg" title="Snapshot">📷</a>
  </div>
</div>

<div class="cell">
  <span class="cam-badge">—</span>
  <div class="empty">+</div>
</div>

<script>
(function() {
  'use strict';

  const LOAD_TIMEOUT = 15000;
  const MENU_HIDE_DELAY = 10000;
  let activeMenu = null;
  let hideTimer = null;
  let expandedCell = null;

  // ── Dashboard grid expand ──
  function toggleGridExpand(cell) {
    if (cell.classList.contains('expanded')) {
      cell.classList.remove('expanded');
      document.body.classList.remove('single');
      expandedCell = null;
    } else {
      if (activeMenu) closeMenu(activeMenu);
      document.querySelectorAll('.cell.expanded').forEach(c => c.classList.remove('expanded'));
      cell.classList.add('expanded');
      document.body.classList.add('single');
      expandedCell = cell;
    }
  }

  // ── Browser fullscreen ──
  function toggleBrowserFullscreen(cell) {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      cell.requestFullscreen().catch(err => {
        console.warn('Fullscreen error:', err);
      });
    }
  }

  function closeMenu(panel) {
    panel.classList.remove('open');
    const btn = panel.closest('.cell').querySelector('.menu-btn');
    if (btn) { btn.classList.remove('open'); btn.textContent = '⋮'; }
    if (activeMenu === panel) activeMenu = null;
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  }

  function openMenu(panel, btn) {
    panel.classList.add('open');
    btn.classList.add('open');
    btn.textContent = '✕';
    activeMenu = panel;
    resetHideTimer(panel);
  }

  function resetHideTimer(panel) {
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(() => closeMenu(panel), MENU_HIDE_DELAY);
  }

  document.querySelectorAll('.cell[data-cam]').forEach(cell => {
    const iframe = cell.querySelector('iframe');
    const overlay = cell.querySelector('.loading-overlay');
    const dot = cell.querySelector('.status-dot');
    const menuBtn = cell.querySelector('.menu-btn');
    const menuPanel = cell.querySelector('.menu-panel');
    const badge = cell.querySelector('.cam-badge');
    const backBtn = cell.querySelector('.back-btn');

    // ── Iframe load ──
    iframe.addEventListener('load', () => {
      overlay.classList.remove('active');
      dot.className = 'status-dot ok';
    });

    let loadTimer = setTimeout(() => {
      if (overlay.classList.contains('active')) {
        overlay.classList.remove('active');
        dot.className = 'status-dot err';
      }
    }, LOAD_TIMEOUT);

    iframe.addEventListener('load', () => {
      clearTimeout(loadTimer);
      loadTimer = setTimeout(() => {
        if (overlay.classList.contains('active')) {
          overlay.classList.remove('active');
          dot.className = 'status-dot err';
        }
      }, LOAD_TIMEOUT);
    });

    // ── Badge → grid expand ──
    badge.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleGridExpand(cell);
    });

    // ── Back → grid expand ──
    backBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleGridExpand(cell);
    });

    // ── Menu toggle ──
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menuPanel.classList.contains('open');
      if (activeMenu && activeMenu !== menuPanel) closeMenu(activeMenu);
      if (isOpen) closeMenu(menuPanel);
      else openMenu(menuPanel, menuBtn);
    });

    // ── Menu actions ──
    menuPanel.querySelectorAll('[data-action]').forEach(item => {
      item.addEventListener('click', (e) => {
        const action = item.dataset.action;

        if (action === 'expand') {
          e.preventDefault();
          toggleGridExpand(cell);
          closeMenu(menuPanel);
        }

        if (action === 'fullscreen') {
          e.preventDefault();
          toggleBrowserFullscreen(cell);
          closeMenu(menuPanel);
        }

        if (action === 'reload') {
          e.preventDefault();
          const now = Date.now();
          if (menuPanel._cooldown && now - menuPanel._cooldown < 3000) return;
          menuPanel._cooldown = now;
          dot.className = 'status-dot loading';
          overlay.classList.add('active');
          iframe.src = iframe.src;
          closeMenu(menuPanel);
        }

        if (action === 'audio') {
          e.preventDefault();
          item.classList.remove('audio-off');
          item.classList.add('audio-on');
          item.textContent = '🔊';
          iframe.src = iframe.src;
          setTimeout(() => { item.style.display = 'none'; }, 2000);
          closeMenu(menuPanel);
        }

        if (action === 'snapshot') closeMenu(menuPanel);
        resetHideTimer(menuPanel);
      });
    });

    // ── Auto-hide ──
    menuPanel.addEventListener('mouseenter', () => resetHideTimer(menuPanel));
    menuPanel.addEventListener('mouseleave', () => resetHideTimer(menuPanel));

    // ── Close on outer click ──
    document.addEventListener('click', (e) => {
      if (activeMenu && !activeMenu.contains(e.target) && !menuBtn.contains(e.target)) {
        closeMenu(activeMenu);
      }
    });

    // ── Audio button ──
    const audioItem = menuPanel.querySelector('[data-action="audio"]');
    if (audioItem) {
      setTimeout(() => { audioItem.style.display = 'flex'; }, 3000);
    }

    // ── Visibility ──
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        setTimeout(() => { dot.className = 'status-dot ok'; }, 500);
      }
    });
  });

  // ── Escape → exit fullscreen or grid expand ──
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (expandedCell) toggleGridExpand(expandedCell);
    }
  });

  // ── Fullscreen change: back button visibility ──
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && expandedCell) {
      // Exited browser fullscreen, keep grid expanded
    }
  });
})();
</script>
</body>
</html>
